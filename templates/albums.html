<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>相册</title>
<style>
  body { margin:0; background:#F0F0F0; font-family:"Microsoft YaHei",sans-serif; font-size:17px; color:#333; }
  header { padding:28px 40px 12px; }
  header h1 { margin:0; font-size:28px; }
  header p { margin:6px 0 0; color:#777; font-size:15px; }
  .wall { display:flex; flex-wrap:wrap; gap:28px; padding:24px 40px 60px; }
  .card { position:relative; width:240px; text-decoration:none; color:#333; background:#fff; border:1px solid #ddd; border-radius:6px; }
  .card img { width:240px; height:240px; object-fit:cover; display:block; border-radius:6px 6px 0 0; }
  .card .info { padding:12px 14px; }
  .card .name { font-size:18px; font-weight:bold; }
  .card .count { font-size:14px; color:#888; margin-top:4px; }
  .covbtn { display:none; position:absolute; top:8px; right:8px; background:rgba(0,0,0,.55);
            color:#fff; border:none; font-size:14px; padding:6px 12px; border-radius:6px;
            cursor:pointer; font-family:inherit; }
  .card:hover .covbtn { display:block; }
  .covmenu { display:none; position:absolute; top:42px; right:8px; background:#fff;
             border:1px solid #ccc; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.18); z-index:3; }
  .covmenu button { display:block; width:100%; border:none; background:#fff; font-size:15px;
                    padding:10px 18px; cursor:pointer; text-align:left; font-family:inherit; white-space:nowrap; }
  .covmenu button:hover { background:#F0F0F0; }
  .card.all { background:#4A90D9; color:#fff; border-color:#4A90D9; }
  .card.all .count { color:#e3eef9; }
  .importbox { margin:0 40px 60px; padding:24px 28px; background:#fff; border:1px solid #ddd;
               border-radius:6px; max-width:720px; }
  .importbox h2 { margin:0 0 10px; font-size:21px; }
  .importbox p { margin:0 0 16px; color:#666; font-size:15px; }
  .importbox input { font-size:17px; padding:10px 12px; width:340px; border:1px solid #aaa;
                     border-radius:6px; font-family:inherit; }
  .importbox button { font-size:17px; padding:10px 26px; background:#5CB85C; color:#fff;
                      border:none; border-radius:6px; cursor:pointer; margin-left:12px; }
  #importmsg { margin-left:14px; color:#777; font-size:15px; }
</style>
</head>
<body>
<header>
  <h1>相册</h1>
  <p>共 {{ total }} 张照片</p>
</header>
<div class="wall">
  <a class="card all" href="{{ url_for('all_photos') }}">
    <div class="info" style="height:240px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <div class="name" style="font-size:22px;">全部照片</div>
      <div class="count" style="margin-top:10px;">时间轴浏览</div>
    </div>
  </a>
  {% for w in walls %}
  <a class="card" href="{{ w.url }}">
    <img src="{{ w.cover }}" loading="lazy" alt="{{ w.name }}">
    <div class="info">
      <div class="name">{{ w.name }}</div>
      <div class="count">{{ w.count }} 张</div>
    </div>
    <button class="covbtn" onclick="toggleCovMenu(event, this)">🖼 封面</button>
    <div class="covmenu">
      <button onclick="pickUpload(event, '{{ w.name }}')">上传封面图</button>
      {% if w.custom %}<button onclick="resetCover(event, '{{ w.name }}')">恢复默认封面</button>{% endif %}
    </div>
  </a>
  {% endfor %}
</div>
<input type="file" id="covfile" accept="image/*" style="display:none">

<div class="importbox">
  <h2>📦 从压缩包导入</h2>
  <p>把照片压缩包（zip，套娃包也行）放进照片目录下的 <b>待导入</b> 文件夹，然后：</p>
  <input id="importalbum" list="albumlist" placeholder="导入到哪个相册（可输入新名字，默认：未分类）">
  <datalist id="albumlist">
    {% for w in walls %}<option value="{{ w.name }}">{% endfor %}
  </datalist>
  <button onclick="doImport()">开始导入</button>
  <span id="importmsg"></span>
</div>

<script>
// ---------- 封面设置 ----------
let covAlbum = null;
function toggleCovMenu(e, btn) {
  e.preventDefault(); e.stopPropagation();
  const menu = btn.nextElementSibling;
  document.querySelectorAll('.covmenu').forEach(m => { if (m !== menu) m.style.display = 'none'; });
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
document.addEventListener('click', () =>
  document.querySelectorAll('.covmenu').forEach(m => m.style.display = 'none'));
function pickUpload(e, name) {
  e.preventDefault(); e.stopPropagation();
  covAlbum = name;
  document.getElementById('covfile').click();
}
document.getElementById('covfile').addEventListener('change', function () {
  if (!this.files.length) return;
  const fd = new FormData();
  fd.append('album', covAlbum);
  fd.append('file', this.files[0]);
  fetch('/api/album_cover/upload', {method: 'POST', body: fd})
    .then(r => r.json()).then(d => {
      if (d.ok) location.reload();
      else alert('设置失败：' + (d.error || '未知错误'));
    });
  this.value = '';
});
function resetCover(e, name) {
  e.preventDefault(); e.stopPropagation();
  fetch('/api/album_cover/reset', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({album: name})
  }).then(() => location.reload());
}

function doImport() {
  const album = document.getElementById('importalbum').value.trim() || '未分类';
  const msg = document.getElementById('importmsg');
  if (!confirm(`把「待导入」里所有压缩包拆开，导入到「${album}」？`)) return;
  msg.textContent = '导入中，请稍等……';
  fetch('/api/import', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({album})
  }).then(r => r.json()).then(d => {
    if (d.ok) {
      let text = `完成 ✓ 拆了 ${d.zips} 个压缩包，导入 ${d.media} 个文件`;
      if (d.errors && d.errors.length) text += `（${d.errors.length} 个出错）`;
      alert(text);
      location.reload();
    } else {
      msg.textContent = '失败：' + (d.error || '未知错误');
    }
  });
}
</script>
</body>
</html>
